name: Example preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @exterior/example... build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_EXTERIOR_URL: ${{ vars.VITE_EXTERIOR_URL || 'https://relay.apps.superpowerlulu.win' }}
      - run: cp apps/example/dist/index.html apps/example/dist/404.html && touch apps/example/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/example/dist
      - id: deployment
        uses: actions/deploy-pages@v4
