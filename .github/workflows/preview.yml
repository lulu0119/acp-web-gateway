name: Preview packages

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to publish
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mukae/client... --filter mukae... --filter @mukae/example... build
        env:
          VITE_MUKAE_URL: ${{ vars.VITE_MUKAE_URL }}
      - run: pnpm exec pkg-pr-new publish --pnpm --previewVersion --no-compact --comment=off --no-template --packageManager=pnpm ./packages/contract ./packages/client ./packages/gateway
      - run: pnpm dlx wrangler@4.149.0 deploy
        working-directory: apps/example
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
